spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chronoflow?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      model: ${DASHSCOPE_MODEL:qwen-flash}
  web:
    resources:
      static-locations: classpath:/static/,file:/app/static/

mybatis-plus:
  type-aliases-package: com.chronoflow.backend.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
    min-response-size: 1024


app:
  version: ${APP_VERSION:1.1.0}
  version-code: ${APP_VERSION_CODE:1}
  download-url: ${APP_DOWNLOAD_URL:}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

notification:
  ai:
    model: ${NOTIFICATION_AI_MODEL:qwen-flash}
    temperature: ${NOTIFICATION_AI_TEMPERATURE:0.0}

aliyun:
  sms:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
  dm:
    access-key-id: ${ALIYUN_DM_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_DM_ACCESS_KEY_SECRET:}
    account-name: ${ALIYUN_DM_ACCOUNT_NAME:}
    from-alias: ${ALIYUN_DM_FROM_ALIAS:时纪流}
  green:
    access-key-id: ${ALIYUN_GREEN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_GREEN_ACCESS_KEY_SECRET:}
    service: ${ALIYUN_GREEN_SERVICE:ugc_moderation_byllm}
    endpoint: ${ALIYUN_GREEN_ENDPOINT:green-cip.cn-shanghai.aliyuncs.com}
  cloudauth:
    access-key-id: ${ALIYUN_CLOUDAUTH_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_CLOUDAUTH_ACCESS_KEY_SECRET:}
    endpoint: ${ALIYUN_CLOUDAUTH_ENDPOINT:cloudauth.cn-shanghai.aliyuncs.com}
    scene-id: ${ALIYUN_CLOUDAUTH_SCENE_ID:}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:chronoflow}
  base-url: ${MINIO_BASE_URL:http://localhost:9000/chronoflow}
