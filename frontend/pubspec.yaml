name: frontend
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_secure_storage: ^10.3.0
  shared_preferences: ^2.2.2
  table_calendar: ^3.1.2
  image_picker: ^1.0.7
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_barcode_scanning: ^0.14.2
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  gal: ^2.3.0
  device_calendar: ^4.3.2
  timezone: ^0.9.4
  receive_sharing_intent: ^1.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/AppIcons/android/mipmap-xhdpi/ic_launcher.png
    - assets/AppIcons/android/mipmap-xxhdpi/ic_launcher.png
    - assets/AppIcons/android/mipmap-xxxhdpi/ic_launcher.png
